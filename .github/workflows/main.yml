name: Run DCvid and DCbot

on:
  push:
    branches:
      - main  # Trigger the workflow on pushes to the main branch

jobs:
  run-dcvid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'  # Or your preferred Python version

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run DCvid (Flask app)
        run: |
          # Run flask app in background
          nohup python dcvid.py &
          sleep 60 # Wait for flask app to start

      - name: Run DCbot (Discord bot)
        run: |
          nohup python dcbot.py &


  # Add more jobs as needed for other tasks (e.g., testing)

